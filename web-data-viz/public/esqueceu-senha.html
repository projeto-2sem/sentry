<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu sua senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/esqueceu-senha.css">
    <link rel="shortcut icon" href="./assets/logos_imgs/sentry_logo_app_dark.png" type="image/x-icon">
</head>

<body>
    <div class="container">
        <header class="header-container">
            <img src="./assets/logos_imgs/sentry_logo_grid-removebg-preview.png" alt="Logo da Sentry">
            <span>Sentry</span>
        </header>
        <main>
            <div class="container-header">
                <i class="bi bi-lock-fill lock"></i>
                <div class="title-header">
                    <h1>Esqueceu sua senha ?</h1>
                    <p id="text_title">Sem problemas, nós enviamos um email com as instruições</p>
                </div>
            </div>
            <div class="container-send">
                <div class="container-input" id="container_input">
                    <div class="content-input">
                        <p>Email</p>
                        <div class="wrapper-input">
                            <i class="bi bi-envelope-fill"></i>
                            <input type="text" placeholder="Digite seu email" id="ipt_email">
                        </div>
                    </div>
                    <div class="error_message" id="error_message">
                        <p class="paragrafo_error" id="paragrafo_error">Digite um email válido</p>
                    </div>
                    <div class="content-btn">
                        <button onclick="verificarEmail()">Redefinir senha</button>
                    </div>
                    <div class="content-back">
                        <a href="./login.html"><i class="bi bi-chevron-left" id="move_aside"></i>
                            <span>Voltar para o login</span>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>

<script src="./js/esqueceu-senha.js"></script>
