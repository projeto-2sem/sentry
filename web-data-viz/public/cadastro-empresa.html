<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro</title>

    <script src="./js/sessao.js"></script>

    <!-- <link rel="icon" href="./assets/icon/favicon2.ico" /> -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/cadastro-empresa.css">
</head>

<body onload="listar()">

    <main>
        <div class="container-form">
            <header class="header-form">
                <div class="content-return">
                    <i class="bi bi-arrow-left-circle"></i>
                </div>
                <div class="content-create">
                    <div class="title-create">
                        <h1>Crie sua conta</h1>
                        <p>Preencha os dados abaixo para se cadastrar</p>
                    </div>
                    <div class="stepper">
                        <div class="step active" id="step_personal">
                            <div class="circle activated" id="circle1">1</div>
                            <div class="label">Empresa</div>
                        </div>

                        <div class="step active" id="step_acess">
                            <div class="circle" id="circle2">2</div>
                            <div class="label">Dados pessoais</div>
                        </div>

                        <div class="step active" id="step_confirmation">
                            <div class="circle" id="circle3">3</div>
                            <div class="label">Confirmação</div>
                        </div>
                    </div>
                </div>

            </header>

            <section class="card-form">
                <div class="container-inputs">
                    <div class="wrapper-input">
                        <div class="title-input">
                            Nome fantasia
                        </div>
                        <div class="content-input">
                            <input type="text" placeholder="Digite seu nome completo">
                        </div>
                    </div>
                    <div class="wrapper-input">
                        <div class="title-input">
                            Razão social
                        </div>
                        <div class="content-input">
                            <input type="text" placeholder="Digite seu nome completo">
                        </div>
                    </div>
                    <div class="wrapper-input">
                        <div class="title-input">
                            Cnpj
                        </div>
                        <div class="content-input">
                            <input type="text" placeholder="Digite seu nome completo">
                        </div>
                    </div>
                </div>
            </section>
            <div class="content-footer">
                <div class="content-button">
                    <button class="btn-cadastrar">Continuar</button>
                </div>
            </div>
        </div>
    </main>

</body>

</html>

<script>

    // Array para armazenar empresas cadastradas para validação de código de ativação 
    let listaEmpresasCadastradas = [];

    function cadastrar() {
        // aguardar();

        //Recupere o valor da nova input pelo nome do id
        // Agora vá para o método fetch logo abaixo
        var nomeVar = nome_input.value;
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;
        var confirmacaoSenhaVar = confirmacao_senha_input.value;
        var codigoVar = codigo_input.value;
        var idEmpresaVincular

        // Verificando se há algum campo em branco
        if (
            nomeVar == "" ||
            emailVar == "" ||
            senhaVar == "" ||
            confirmacaoSenhaVar == "" ||
            codigoVar == ""
        ) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "(Mensagem de erro para todos os campos em branco)";

            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        // Verificando se o código de ativação é de alguma empresa cadastrada
        for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
            if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
                idEmpresaVincular = listaEmpresasCadastradas[i].id
                console.log("Código de ativação válido.");
                break;
            } else {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
                finalizarAguardar();
            }
        }

        // Enviando o valor da nova input
        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
                idEmpresaVincularServer: idEmpresaVincular
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    cardErro.style.display = "block";

                    mensagem_erro.innerHTML =
                        "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                    setTimeout(() => {
                        window.location = "login.html";
                    }, "2000");

                    limparFormulario();
                    finalizarAguardar();
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });

        return false;
    }

    // Listando empresas cadastradas 
    function listar() {
        fetch("/empresas/listar", {
            method: "GET",
        })
            .then(function (resposta) {
                resposta.json().then((empresas) => {
                    empresas.forEach((empresa) => {
                        listaEmpresasCadastradas.push(empresa);

                        console.log("listaEmpresasCadastradas")
                        console.log(listaEmpresasCadastradas[0].codigo_ativacao)
                    });
                });
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }
</script>
