<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTRY | Ajuda</title>
    <link rel="icon" href="../assets/imgs/logo_oficial.png">
    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
</head>

<body onload="escreverNavbar()">
    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar_top_wrapper">
                <div class="sidebar_logo">
                    <img src="../assets/imgs/sentry_logo_grid-removebg-preview.png" alt="">
                    <span class="text-sidebar">SENTRY</span>
                </div>
                <button class="sidebar_close" type="button" onclick="move_aside()" data-hidden="0"
                    id="btn_move_aside"><i class="bi bi-chevron-left" id="move_aside"></i></button>
            </div>
            <div class="sidebar_mid_wrapper">
                <ul class="sidebar_list">
                    <a href="analytics.html">
                        <li class="sidebar_items"><i class="bi bi-columns-gap"></i><span
                                class="text-sidebar">Analytics</span></li>
                    </a>
                    <a href="servidores.html">
                        <li class="sidebar_items"><i class="bi bi-database"></i><span class="text-sidebar">Server</span>
                        </li>
                    </a>
                    <a href="alertas.html">
                        <li class="sidebar_items"><i class="bi bi-exclamation-triangle-fill"></i><span
                                class="text-sidebar">Alertas</span>
                        </li>
                    </a>
                    <a href="equipe.html">
                        <li class="sidebar_items"><i class="bi bi-people-fill"></i><span
                                class="text-sidebar">Equipe</span></li>
                    </a>
                    <a href="ajuda.html">
                        <li class="sidebar_items selected_items"><i class="bi bi-headset"></i><span class="text-sidebar">Ajuda</span>
                        </li>
                    </a>
                </ul>
            </div>
            <div class="sidebar_bot_wrapper">
                <div class="sidebar_account_wrapper" id="sidebar_account_wrapper">
                    <div class="sidebar_account_photo">
                        <h3 id="siglas_usuario">GS</h3>
                    </div>
                    <div class="sidebar_account_infos">
                        <p class="text-sidebar" id="nome_usuario">Usuário</p>
                        <p class="text-sidebar" id="cargo_usuario">Analista</p>
                    </div>
                </div>
                <a class="sidebar_bot_leave" href="../index.html">
                    <div class="card_logout">
                        <i class="bi bi-box-arrow-in-right"></i><span class="text-sidebar">Sair</span>
                    </div>
                </a>
            </div>
        </aside>

        <main class="w-100 bg-blue-500 flex items-center justify-center">
            <h1>Tire suas dúvidas com a OlívIA, a nossa agente de IA preparada para sanar as suas dúvidas!</h1>
            <section id="olivia-chat" class="w-50 bg-red-500">
                <div id="messages-wrapper">

                </div>
                <div id="input-area">
                    <input type="text" placeholder="Digite aqui...">
                    <button>Enviar</button>
                </div>
            </section>
        </main>


</html>
<script>
    document.getElementById("nome_usuario").innerText = sessionStorage.NOME_USUARIO || "Usuário";
    document.getElementById("cargo_usuario").innerText = sessionStorage.CARGO || "Analista";
    let sigla = sessionStorage.NOME_USUARIO.split(" ");
    sigla = sigla[0][0] + sigla[1][0];
    document.getElementById("siglas_usuario").innerText = sigla || "";


    function move_aside() {
        let move = document.getElementById("btn_move_aside");
        let data = move.dataset.hidden;
        let class_side_bar = document.querySelector(".sidebar");
        let i_move_side = document.getElementById("move_aside");
        if (data == 0) {
            class_side_bar.classList.add("closed");
            move.dataset.hidden = 1;
            i_move_side.classList.replace("bi-chevron-left", "bi-chevron-right");
            document.getElementById("sidebar_account_wrapper").style.display = "none";
        } else {
            class_side_bar.classList.remove("closed");
            move.dataset.hidden = 0;
            i_move_side.classList.replace("bi-chevron-right", "bi-chevron-left");
            document.getElementById("sidebar_account_wrapper").style.display = "flex";
        }
    }

    function escreverNavbar() {
        if (sessionStorage.CARGO.toLowerCase() == "analista") {
            document.getElementById("sidebar").innerHTML = `
        <div class="sidebar_top_wrapper">
                <div class="sidebar_logo">

                    <span class="text-sidebar">SENTRY</span>
                </div>
                <button class="sidebar_close" type="button" onclick="move_aside()" data-hidden="0"
                    id="btn_move_aside"><i class="bi bi-chevron-left" id="move_aside"></i></button>
            </div>
            <div class="sidebar_mid_wrapper">
                <ul class="sidebar_list">
                    <a href="servidores.html">
                        <li class="sidebar_items"><i class="bi bi-database"></i><span class="text-sidebar">Server</span>
                        </li>
                    </a>
                    <a href="alertas.html">
                        <li class="sidebar_items"><i class="bi bi-exclamation-triangle-fill"></i><span
                                class="text-sidebar">Alertas</span>
                        </li>
                    </a>
                    <a href="">
                        <li class="sidebar_items selected_items"><i class="bi bi-headset"></i><span class="text-sidebar">Ajuda</span>
                        </li>
                    </a>
                </ul>
            </div>
            <div class="sidebar_bot_wrapper">
                <div class="sidebar_account_wrapper">
                    <div class="sidebar_account_photo">
                        <h3 id="siglas_usuario">GS</h3>
                    </div>
                    <div class="sidebar_account_infos">
                        <p class="text-sidebar" id="nome_usuario">Usuário</p>
                        <p class="text-sidebar" id="cargo_usuario">Analista</p>
                    </div>
                </div>
                <a class="sidebar_bot_leave" href="../index.html">
                    <div class="card_logout">
                        <i class="bi bi-box-arrow-in-right"></i><span class="text-sidebar">Sair</span>
                    </div>
                </a>
            </div>
        `
        } else {
            document.getElementById("sidebar").innerHTML = `
        <div class="sidebar_top_wrapper">
                <div class="sidebar_logo">
                    <img src="../assets/imgs/sentry_logo_grid-removebg-preview.png" alt="">
                    <span class="text-sidebar">SENTRY</span>
                </div>
                <button class="sidebar_close" type="button" onclick="move_aside()" data-hidden="0"

                </ul>
            </div>

                <div class="sidebar_account_wrapper">

                        <h3 id="siglas_usuario">GS</h3>
                    </div>
                    <div class="sidebar_account_infos">
                        <p class="text-sidebar" id="nome_usuario">Usuário</p>

                    </div>
                </div>

                    </div>
                </a>
            </div>
        `
        }
        document.getElementById("nome_usuario").innerText = sessionStorage.NOME_USUARIO || "Usuário";
        document.getElementById("cargo_usuario").innerText = sessionStorage.CARGO == "gestor" ? "Gestor" : "Analista";
        let sigla = sessionStorage.NOME_USUARIO.split(" ");
        sigla = sigla[0][0] + sigla[1][0];
        document.getElementById("siglas_usuario").innerText = sigla || "";
    }
</script>
