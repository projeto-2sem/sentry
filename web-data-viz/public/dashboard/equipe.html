    function editarFuncionarios() {
        let nome = ipt_nome.value;
        let cargo = ipt_cargo.value;
        let nome_enviado = "";
        let cargo_enviado = "";

        nome = nome.trim();
        cargo = cargo.trim();

        if (!nome || !cargo) {
            alert("Preencha todos os campos!");
            return;
        }
        if (!(nome.includes(" "))) {
            alert("Escreva o nome inteiro");
            return;
        }

        for (let i = 0; i < nome.length; i++) {
            if (i == 0) {
                nome_enviado += nome[i].toUpperCase();
                continue;
            }

            if (nome[i] == " ") {
                nome_enviado += " "
                nome_enviado += nome[i + 1].toUpperCase();
                i++;

            } else {
                nome_enviado += nome[i].toLowerCase();
            }
        }

        for (let i = 0; i < cargo.length; i++) {
            if (i == 0) {
                cargo_enviado += cargo[i].toUpperCase();

            } else {
                cargo_enviado += cargo[i].toLowerCase();
            }
        }

        nome_enviado = nome_enviado.trim();

        fetch(`/usuarios/editarFuncionarios/${idUsuarioEditar}/${nome_enviado}/${cargo_enviado}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                    listarFuncionarios();

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
            });
    }

    function email() {
        //enviar email
        const nomeServer = document.getElementById("contato_nome").value;
        const emailServer = document.getElementById("contato_email").value;
        const mensagemServer = document.getElementById("contato_mensagem").value;
        const senhaUsuario = document.getElementById("contato_senha").value;
        const emailUsuario = sessionStorage.EMAIL_USUARIO;

        if (!nomeServer || !emailServer || !mensagemServer || !emailUsuario || !senhaUsuario) {
            alert("Preencha todos os campos");
            return;
        }

        fetch("/email/emailFuncionario", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ emailUsuario, emailServer, nomeServer, mensagemServer, senhaUsuario }),
        }).then(function (resposta) {
            if (resposta.ok) {
                alert("Mensagem enviada com sucesso! Verifique seu email.");
            } else {
                alert("Erro ao enviar. Tente novamente.");
            }

        }).catch(function (erro) {
            console.log(erro);
        })
