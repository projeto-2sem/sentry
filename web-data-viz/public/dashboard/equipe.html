<script>
    empresaId = sessionStorage.ID_EMPRESA;
    numero_modals_contato = 0;

    function listarFuncionarios() {
        document.getElementById("container-pessoa-adm").innerHTML = "";
        document.getElementById("container-pessoa-analista").innerHTML = "";

        fetch(`/usuarios/listarFuncionarios/${empresaId}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    numero_modals_contato = resposta.length;

                    for (let i = 0; i < resposta.length; i++) {
                        if (resposta[i].cargo == "Analista") {
                            let sigla = resposta[i].nome.split(" ");
                            sigla = sigla[0][0] + sigla[1][0];

                            document.getElementById("container-pessoa-analista").innerHTML +=
                                `<div class="pessoa_div" id="pessoa_div">
                                <div class="editar_pencil"><button onclick="abrirCardCreate('card-editar-func', null)"><i
                                    class="bi bi-pencil-fill"></i></button></div>
                                <div id="foto">
                                    <h3 id="siglas">${sigla}</h3>
                                </div>
                                <p id="nome">${resposta[i].nome}</p>
                                <p id="email"><span class="abrir-modal-contato" onclick="abrirCardCreate('card-contato', '${resposta[i].email}')">${resposta[i].email}</span></p>
                                <p id="data">${resposta[i].data_criacao}</p>
                            </div>`;

                        } else {
                            let sigla = resposta[i].nome.split(" ");
                            sigla = sigla[0][0] + sigla[1][0];

                            document.getElementById("container-pessoa-adm").innerHTML +=
                                `<div class="pessoa_div" id="pessoa_div">
                                <div class="editar_pencil"><button onclick="abrirCardCreate('card-editar-func', null)"><i
                                    class="bi bi-pencil-fill"></i></button></div>
                                <div id="foto">
                                    <h3 id="siglas">${sigla}</h3>
                                </div>
                                <p id="nome">${resposta[i].nome}</p>
                                <p id="email"><span class="abrir-modal-contato" onclick="abrirCardCreate('card-contato', '${resposta[i].email}')">${resposta[i].email}</span></p>
                                <p id="data">${resposta[i].data_criacao}</p>
                            </div>`;
                        }
                    }

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
            });
    }

    //abrir e fechar card
    const today = new Date().toLocaleDateString("pt-BR");
    date_now.innerHTML = today

    function abrirCardCreate(card, email_atual) {
        document.getElementById(card).style.display = "flex";

        if (card == "card-contato") {
            document.getElementById("contato_email").value = email_atual;
        }
    }

    function fecharCard(card) {
        document.getElementById(card).style.display = "none";
    }

    function email() {
        //enviar email
        const nomeServer = document.getElementById("contato_nome").value;
        const emailServer = document.getElementById("contato_email").value;
        const mensagemServer = document.getElementById("contato_mensagem").value;
        const senhaUsuario = document.getElementById("contato_senha").value;
        const emailUsuario = sessionStorage.EMAIL_USUARIO;

        if (!nomeServer || !emailServer || !mensagemServer || !emailUsuario || !senhaUsuario) {
            alert("Preencha todos os campos");
            return;
        }

        fetch("/email/emailFuncionario", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ emailUsuario, emailServer, nomeServer, mensagemServer, senhaUsuario }),
        }).then(function (resposta) {
            if (resposta.ok) {
                alert("Mensagem enviada com sucesso! Verifique seu email.");
            } else {
                alert("Erro ao enviar. Tente novamente.");
            }

        }).catch(function (erro) {
            console.log(erro);
        })
    }
</script>
