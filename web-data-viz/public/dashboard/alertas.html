<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTRY | Alertas</title>

    <link rel="icon" href="../assets/imgs/logo_oficial.png">
    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .alertas-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 20px;
        }
        .alerta-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            background-color: var(--second-color);
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 16px 20px;
            transition: background-color 0.2s ease;
        }
        .alerta-card:hover {
            background-color: var(--hover);
        }
        .alerta-informacoes {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .alerta-status {
            padding: 4px 10px;
            background-color: #ef4444;
            color: #fff;
            border-radius: 8px;
            font-family: "Montserrat", sans-serif;
            font-size: 12px;
            font-weight: 600;
        }
        .alerta-data, .alerta-horario {
            color: #94a3b8;
            font-family: "Montserrat", sans-serif;
            font-size: 12px;
        }
        .alerta-separador {
            color: #64748b;
            font-size: 12px;
        }
        .alerta-card p {
            color: var(--text-color);
            font-family: "Montserrat", sans-serif;
            font-size: 14px;
            line-height: 1.4;
        }
        @media (max-width: 768px) {
            .alertas-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body onload="escreverNavbar(); carregarAlertasCriticos();">
    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar_top_wrapper">
                <div class="sidebar_logo">
                    <img src="../assets/imgs/sentry_logo_grid-removebg-preview.png" alt="">
                    <span class="text-sidebar">SENTRY</span>
                </div>
                <button class="sidebar_close" type="button" onclick="move_aside()" data-hidden="0"
                    id="btn_move_aside"><i class="bi bi-chevron-left" id="move_aside"></i></button>
            </div>
            <div class="sidebar_mid_wrapper">
                <ul class="sidebar_list">
                    <a href="analytics.html">
                        <li class="sidebar_items"><i class="bi bi-columns-gap"></i><span
                                class="text-sidebar">Analytics</span></li>
                    </a>
                    <a href="servidores.html">
                        <li class="sidebar_items"><i class="bi bi-database"></i><span class="text-sidebar">Server</span>
                        </li>
                    </a>
                    <a href="">
                        <li class="sidebar_items selected_items"><i class="bi bi-exclamation-triangle-fill"></i><span
                                class="text-sidebar">Alertas</span>
                        </li>
                    </a>
                    <a href="equipe.html">
                        <li class="sidebar_items"><i class="bi bi-people-fill"></i><span
                                class="text-sidebar">Equipe</span></li>
                    </a>
                    <a href="ajuda.html">
                        <li class="sidebar_items"><i class="bi bi-headset"></i><span class="text-sidebar">Ajuda</span>
                        </li>
                    </a>
                </ul>
            </div>
            <div class="sidebar_bot_wrapper">
                <div class="sidebar_account_wrapper" id="sidebar_account_wrapper">
                    <div class="sidebar_account_photo">
                        <h3 id="siglas_usuario">GS</h3>
                    </div>
                    <div class="sidebar_account_infos">
                        <p class="text-sidebar" id="nome_usuario">Usuário</p>
                        <p class="text-sidebar" id="cargo_usuario">Analista</p>
                    </div>
                </div>
                <a class="sidebar_bot_leave" href="../index.html">
                    <div class="card_logout">
                        <i class="bi bi-box-arrow-in-right"></i><span class="text-sidebar">Sair</span>
                    </div>
                </a>
            </div>
        </aside>

        <main>
            <header class="server-header">
                <div class="title-header">
                    <h1>Alertas</h1>
                    <time id="date_now">27/10/2026</time>
                </div>
            </header>

            <section class="server-content">
                <div class="server-content-header">
                    <h2>Alertas Críticos Atuais da Infraestrutura</h2>
                </div>

                <div class="alertas-grid" id="listaAlertas">
                    <!-- Preenchido via script com os 3 alertas críticos reais do MVP -->
                </div>
            </section>
        </main>

        <div id="mobile-navbar">
            <nav class="mobile-navbar">
                <ul class="sidebar_list_mobile">
                    <a href="analytics.html">
                        <li class="sidebar_items_mobile"><i class="bi bi-columns-gap"></i></li>
                    </a>
                    <a href="servidores.html">
                        <li class="sidebar_items_mobile"><i class="bi bi-database"></i></li>
                    </a>
                    <a href="">
                        <li class="sidebar_items_mobile selected_items"><i class="bi bi-exclamation-triangle-fill"></i>
                        </li>
                    </a>
                    <a href="equipe.html">
                        <li class="sidebar_items_mobile"><i class="bi bi-people-fill"></i>
                        </li>
                    </a>
                    <a href="ajuda.html">
                        <li class="sidebar_items_mobile"><i class="bi bi-headset"></i>
                        </li>
                    </a>
                    <a href="../index.html">
                        <li class="sidebar_items_mobile"><i class="bi bi-box-arrow-in-right"></i>
                        </li>
                    </a>
                </ul>
            </nav>
        </div>
    </div>
</body>

</html>
<script>
    document.getElementById("nome_usuario").innerText = sessionStorage.NOME_USUARIO || "Usuário";
    document.getElementById("cargo_usuario").innerText = sessionStorage.CARGO || "Analista";
    let sigla = sessionStorage.NOME_USUARIO ? sessionStorage.NOME_USUARIO.split(" ") : ["G", "S"];
    sigla = sigla[0][0] + (sigla[1] ? sigla[1][0] : "S");
    document.getElementById("siglas_usuario").innerText = sigla || "";
    
    const today = new Date().toLocaleDateString("pt-BR");
    document.getElementById("date_now").innerHTML = today;

    function move_aside() {
        let move = document.getElementById("btn_move_aside");
        let data = move.dataset.hidden;
        let class_side_bar = document.querySelector(".sidebar");
        let i_move_side = document.getElementById("move_aside");
        if (data == 0) {
            class_side_bar.classList.add("closed");
            move.dataset.hidden = 1;
            i_move_side.classList.replace("bi-chevron-left", "bi-chevron-right");
            document.getElementById("sidebar_account_wrapper").style.display = "none";
        } else {
            class_side_bar.classList.remove("closed");
            move.dataset.hidden = 0;
            i_move_side.classList.replace("bi-chevron-right", "bi-chevron-left");
            document.getElementById("sidebar_account_wrapper").style.display = "flex";
        }
    }

    // Apenas os 3 alertas críticos reais (um para cada servidor do MVP)
    const alertasCriticosReais = [
        {
            hostname: "SRV-APP-01",
            apelido: "Servidor Aplicação Principal",
            data: "27/10/2026",
            horario: "23:30",
            mensagem: "Atingiu uso crítico de CPU em <strong>90.8%</strong> (acima do limite crítico de 80%)."
        },
        {
            hostname: "SRV-DB-01",
            apelido: "Servidor Banco de Dados",
            data: "27/10/2026",
            horario: "23:30",
            mensagem: "Uso crítico de Memória RAM atingiu <strong>94.0%</strong> (acima do limite crítico de 90%)."
        },
        {
            hostname: "SRV-FILE-01",
            apelido: "Servidor Arquivos e Storage",
            data: "27/10/2026",
            horario: "23:30",
            mensagem: "Espaço em disco atingiu limite crítico com <strong>94.5%</strong> de ocupação (acima do limite crítico de 90%)."
        }
    ];

    function carregarAlertasCriticos() {
        const listaAlertas = document.getElementById("listaAlertas");
        if (!listaAlertas) return;
        listaAlertas.innerHTML = "";

        for (let i = 0; i < alertasCriticosReais.length; i++) {
            const alt = alertasCriticosReais[i];
            listaAlertas.innerHTML += `
            <article class="alerta-card">
                <div class="alerta-informacoes">
                    <span class="alerta-status" style="background-color: #ef4444;">Crítico</span>
                    <span class="alerta-data">Data: ${alt.data}</span>
                    <span class="alerta-separador">|</span>
                    <span class="alerta-horario">Horário: ${alt.horario}</span>
                </div>
                <p><strong>${alt.hostname} (${alt.apelido}):</strong> ${alt.mensagem}</p>
            </article>`;
        }
    }

    function escreverNavbar() {
        if (sessionStorage.CARGO && sessionStorage.CARGO.toLowerCase() == "analista") {
            document.getElementById("sidebar").innerHTML = `
        <div class="sidebar_top_wrapper">
                <div class="sidebar_logo">
                    <img src="../assets/imgs/sentry_logo_grid-removebg-preview.png" alt="">
                    <span class="text-sidebar">SENTRY</span>
                </div>
                <button class="sidebar_close" type="button" onclick="move_aside()" data-hidden="0"
                    id="btn_move_aside"><i class="bi bi-chevron-left" id="move_aside"></i></button>
            </div>
            <div class="sidebar_mid_wrapper">
                <ul class="sidebar_list">
                    <a href="servidores.html">
                        <li class="sidebar_items"><i class="bi bi-database"></i><span class="text-sidebar">Server</span>
                        </li>
                    </a>
                    <a href="">
                        <li class="sidebar_items selected_items"><i class="bi bi-exclamation-triangle-fill"></i><span
                                class="text-sidebar">Alertas</span>
                        </li>
                    </a>
                    <a href="ajuda.html">
                        <li class="sidebar_items"><i class="bi bi-headset"></i><span class="text-sidebar">Ajuda</span>
                        </li>
                    </a>
                </ul>
            </div>
            <div class="sidebar_bot_wrapper">
                <div class="sidebar_account_wrapper">
                    <div class="sidebar_account_photo">
                        <h3 id="siglas_usuario">GS</h3>
                    </div>
                    <div class="sidebar_account_infos">
                        <p class="text-sidebar" id="nome_usuario">Usuário</p>
                        <p class="text-sidebar" id="cargo_usuario">Analista</p>
                    </div>
                </div>
                <a class="sidebar_bot_leave" href="../index.html">
                    <div class="card_logout">
                        <i class="bi bi-box-arrow-in-right"></i><span class="text-sidebar">Sair</span>
                    </div>
                </a>
            </div>
        `;

        document.getElementById("mobile-navbar").innerHTML = `
        <nav class="mobile-navbar">
                <ul class="sidebar_list_mobile">
                    <a href="servidores.html">
                        <li class="sidebar_items_mobile"><i class="bi bi-database"></i></li>
                    </a>
                    <a href="">
                        <li class="sidebar_items_mobile selected_items"><i class="bi bi-exclamation-triangle-fill"></i>
                        </li>
                    </a>
                    <a href="ajuda.html">
                        <li class="sidebar_items_mobile"><i class="bi bi-headset"></i></li>
                    </a>
                    <a href="../index.html">
                        <li class="sidebar_items_mobile"><i class="bi bi-box-arrow-in-right"></i></li>
                    </a>
                </ul>
            </nav>
        `;
        }
    }
</script>
