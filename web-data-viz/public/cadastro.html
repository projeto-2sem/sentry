<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/output.css" />
  <!-- <link rel="icon" href="./assets/icon/favicon2.ico" /> -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body 
  class="flex flex-col bg-[#071224] md:bg-[url('../assets/bgd_imgs/fundo-cadastro.png')] bg-cover bg-repeat">

  <div class="login justify-end mb-9 md:justify-center mt-7">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <!-- <div class="container"> -->
    <div class="card relative md:w-xl md:h-150 md:p-2 md:items-center md:justify-center md:gap-3.5">
      <div class="card-top">
        <img class="w-6 h-6 hover:cursor-pointer" src="./assets/icon/voltar.png" alt="Voltar">
        <div class="text-conta">
          <h2 class="text-2xl font-medium">Crie sua conta</h2>
          <p class="m-1 text-base">Preencha os dados abaixo para se cadastrar</p>
        </div>
      </div>
      <div class="formulario gap-1.5 md:grid md:grid-cols-2 md:w-auto md:gap-y-7 md:gap-x-5">
        <div class="campo">
          <span>Nome Completo</span>
          <img src="./assets/icon/adicionar-usuario.png" alt="">
          <input id="nome_input" type="text" placeholder="Digite seu nome completo" />
        </div>
        <div class="campo">
          <span>Cargo/Função:</span>
          <img src="./assets/icon/trabalhador.png" alt="">
          <input id="cargo_input" type="text" placeholder="Ex: Engenheiro, Técnico..." />
        </div>
        <div class="campo">
          <span>E-mail:</span>
          <img src="./assets/icon/adicionar-usuario.png" alt="">
          <input id="email_input" type="text" placeholder="seuemail@exemplo.com" />
        </div>
        <div class="campo">
          <span>Código de ativação:</span>
          <img src="./assets/icon/usuario-com-monitor-de-computador-e-graficos-de-barras.png" alt="">
          <input id="codigo_input" type="text" placeholder="Insira aqui seu código" />
        </div>
        <div class="campo">
          <span>Senha:</span>
          <img src="./assets/icon/cadeado.png" alt="">
          <input id="senha_input" type="password" placeholder="******" />
        </div>
        <div class="campo">
          <span>Confirmação da Senha:</span>
          <img src="./assets/icon/cadeado.png" alt="">
          <input id="confirmacao_senha_input" type="password" placeholder="******" />
        </div>
      </div>
      <button class="botao w-8" onclick="cadastrar()">Continuar →</button>
      <p class="">Já possui conta? <a class="text-blue-700" href="./login.html">Faça login</a></p>
      <div id="div_aguardar" class="loading-div hidden">
        <!-- <img src="./assets/circle-loading.gif" id="loading-gif" /> -->
      </div>

      <div class="hidden" id="div_erros_login"></div>
    </div>
  </div>
  <!-- </div> -->

  <!--footer inicio-->
  <div class="footer">
    <p>© 2026 SENTRY</p>
    <p>Todos os direitos reservados.</p>
  </div>
  <!--footer fim-->
</body>

</html>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var cargoVar = cargo_input.value;
    var emailVar = email_input.value;
    var codigoVar = codigo_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      cargoVar == "" ||
      emailVar == "" ||
      codigoVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" 
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (senhaVar != confirmacaoSenhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
      "(Mensagem de erro para todos os campos em branco)";
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    // for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
    //   if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
    //     idEmpresaVincular = listaEmpresasCadastradas[i].id
    //     console.log("Código de ativação válido.");
    //     break;
    //   } else {
    //     cardErro.style.display = "block";
    //     mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
    //     finalizarAguardar();
    //   }
    // }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        cargoServer: cargoVar,
        emailServer: emailVar,
        codigoServer: codigoVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  //           console.log("listaEmpresasCadastradas")

  //         });
  //       });
  //     })
  //     .catch(function (resposta) {
  //       console.log(`#ERRO: ${resposta}`);

  function sumirMensagem() {
    cardErro.style.display = "none";
