<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaTech | Login</title>

    <script src="./js/sessao.js"></script>

    <!-- <link rel="stylesheet" href="./css/staly.css"> -->
    <link rel="stylesheet" href="./css/output.css">
    <!-- <link rel="icon" href="./assets/icon/favicon2.ico"> -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body class="flex flex-col bg-[#071224] md:bg-[url('../assets/bgd_imgs/fundo-cadastro.png')] bg-cover">

    <div class="login flex align-top">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="flex flex-col items-center justify-center">
            <img class="w-40 p-1" src="./assets/logos_imgs/sentry_logo_principal-removebg.png" alt="">
            <div class="card md:w-md">
                <div class="card-top">
                    <img class="w-5 h-5" src="./assets/icon/voltar.png" alt="Voltar">
                    <div class="text-conta">
                        <h2 class="text-2xl font-bold">Acesse sua conta</h2>
                        <p class="m-1 text-xs">Entre com as credenciais para continuar</p>
                    </div>
                </div>
                <div class="formulario">
                    <div class="campo">
                        <span>Email</span>
                        <input id="email_input" type="text" placeholder="     seuemail@exemplo.com">
                    </div>
                    <div class="campo">
                        <span>Senha</span>
                        <input id="senha_input" type="password" placeholder="     **********">
                    </div>
                </div>
                <button class="botao" onclick="entrar()">ENTRAR</button>
                <!-- <a>Esqueceu sua senha?</a> -->
                <div id="div_aguardar" class="loading-div">
                    <!-- <img src="./assets/circle-loading.gif" id="loading-gif"> -->
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>
    </div>
        <div class="footer">
            <p>© 2026 SENTRY</p>
            <p>Todos os direitos reservados.</p>
        </div>

</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
