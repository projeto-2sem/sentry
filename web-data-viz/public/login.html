<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SENTRY | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/output.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">   
</head>

<body class="background bk-login md:bg-cover">

    <div class="login flex justify-center align-top md:items-end md:mr-4">
        <div class="alerta_erro hidden">
            <div class="card_erro hidden" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="h-11/12 w-full flex flex-col items-center justify-center md:flex-row md:items-end md:gap-6 md:justify-around">
            <div class="m-2 hidden md:block">
                <h2 class="text-lg font-light text-(--azul-medio)">MONITORAMENTO INTELIGENTE</h2>
                <p class="text-white font-light">Mais performance. Mais segurança. Operações contínuas.</p>
            </div>
            <div class="flex flex-col items-center justify-center md:m-auto md:mx-5 md:justify-between md:gap-1">

                <img class="w-40 p-1" src="./assets/logos_imgs/sentry_logo_principal-removebg.png" alt="">
                <div class="card md:w-97 md:h-97 md:justify-center md:gap-2 ">
                    <div class="card-top">
                        <div class="content-returnr" onclick="voltar()" id="botao_voltar">
                            <i class="bi bi-arrow-left-circle text-xl"></i>
                        </div>
                        <!-- <img class="w-5 h-5" src="./assets/icon/voltar.png" alt="Voltar"> -->
                        <div class="text-conta">
                            <h2 class="text-2xl font-medium">Acesse sua conta</h2>
                            <p class="m-1 text-xs">Entre com as credenciais para continuar</p>
                        </div>
                    </div>
                    <div class="formulario md:gap-4">
                        <div class="campo">
                            <span>Email</span>
                            <i class="bi bi-person-fill"></i>
                            <!-- <img src="./assets/icon/adicionar-usuario.png" alt=""> -->
                            <input id="email_input" type="email" placeholder="seuemail@exemplo.com">
                        </div>
                        <div class="campo">
                            <span>Senha</span>
                            <i class="bi bi-lock-fill"></i>
                            <!-- <img src="./assets/icon/cadeado.png" alt=""> -->
                            <input id="senha_input" type="password" placeholder="**********">
                        </div>
                    </div>
                    <button class="botao" onclick="entrar()">ENTRAR</button>
                    <!-- <a>Esqueceu sua senha?</a> -->
                    <div id="div_aguardar" class="loading-div hidden">
                        <!-- <img class="hidden" src="./assets/circle-loading.gif" id="loading-gif"> -->
                    </div>

                    <div class="hidden" id="div_erros_login"></div>
                </div>
                <div class="footer m-1">
                    <p>© 2026 SENTRY</p>
                    <p>Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

<script>


    function entrar() {

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            alert("E-mail ou senha invalidos");
            return;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        // console.log("FORM LOGIN: ", emailVar);
        // console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function voltar() {
        history.back();
    }


</script>
